[package]
name = "tool-versions"
version = "1.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["Michael S. Klishin and Contributors"]
repository = "https://github.com/michaelklishin/tool-versions-rs"
homepage = "https://github.com/michaelklishin/tool-versions-rs"
description = "Parser and manipulation library for .tool-versions files"
readme = "README.md"
keywords = ["asdf", "tool-versions", "version-manager", "parser"]
categories = ["config", "parsing"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.6"
tempfile = "3.19"
serde_json = "1.0"

[features]
default = []
serde = ["dep:serde"]

[lints.clippy]
uninlined_format_args = "allow"
